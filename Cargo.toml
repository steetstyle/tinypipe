[workspace]
members = [
    "tinypipe-ir",
    "tinypipe-compiler",
    "tinypipe-vm",
    "tinypipe-api",
    "tinypipe-storage",
    "tinypipe-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
bincode = "1.3"
flatbuffers = "25"
