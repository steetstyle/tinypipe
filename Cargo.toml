[workspace]
members = [
    "tinypipe-ir",
    "tinypipe-env",
    "tinypipe-compiler",
    "tinypipe-vm",
    "tinypipe-api",
    "tinypipe-storage",
    "tinypipe-scheduler",
    "tinypipe-tools",
    "tinypipe-insight",
    "tinypipe-proto",
    "tinypipe-daemon",
    "tinypipe-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bincode = "1.3"
flatbuffers = "25"
uuid = { version = "1", features = ["v4"] }
ureq = "2"
postgres = "0.19"
tonic = { version = "0.14", features = ["transport", "codegen"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = { version = "0.14", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
dashmap = "6"
futures = "0.3"
async-stream = "0.3"
