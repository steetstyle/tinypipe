[package]
name = "tinypipe-compiler"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
llm = ["dep:reqwest"]  # LLM integration (OpenAI, Anthropic, Ollama)

[dependencies]
tinypipe-ir = { path = "../tinypipe-ir" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
rustpython-parser = "0.4"
rustpython-ast = "0.4"
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "blocking"] }
